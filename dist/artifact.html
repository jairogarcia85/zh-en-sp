<title>三语 · ZH-EN-SP</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1b1b1f; --muted:#6b6b76;
  --line:#e3e1dc; --accent:#b4302a; --accent2:#0f6b5c; --gold:#c8952a;
  --ok:#1f7a4d; --bad:#b13a2e; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  --r:14px;
}
/* Tema oscuro. Tres estados: el visor puede no marcar nada (sigue al sistema),
   marcar data-theme="dark" o marcar data-theme="light". Los tres deben resolver. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#141416; --panel:#1d1d20; --ink:#ecebe7; --muted:#9a9aa4;
  --line:#2e2e33; --accent:#e2564e; --accent2:#3fb39c; --gold:#e0ad4a;
  --ok:#4bbb84; --bad:#e2695c; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141416; --panel:#1d1d20; --ink:#ecebe7; --muted:#9a9aa4;
  --line:#2e2e33; --accent:#e2564e; --accent2:#3fb39c; --gold:#e0ad4a;
  --ok:#4bbb84; --bad:#e2695c; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",sans-serif}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
a{color:var(--accent2)}

/* ---------- header ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:11px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:24px;font-weight:600}
.top h1{font-size:17px}
.tagline{margin:1px 0 0;font-size:12px;color:var(--muted)}
.topright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.baselang{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.baselang select{font:inherit;font-size:13px;padding:4px 6px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.stat{text-align:center;min-width:48px}
.stat b{display:block;font-size:18px;color:var(--gold)}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;padding:10px 16px 0;overflow-x:auto;background:var(--panel)}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:10px 10px 0 0;
  white-space:nowrap;font-size:14px;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--accent);background:var(--bg)}
.tab em{font-style:normal;background:var(--accent);color:#fff;border-radius:20px;
  padding:1px 7px;font-size:11px;margin-left:4px}
.tab em:empty{display:none}

/* ---------- level bar ---------- */
.levelbar{padding:14px 20px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.levelbar .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.levelpicker{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.lvbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:10px;padding:7px 12px;font-size:13px;display:flex;gap:7px;align-items:center}
.lvbtn b{color:var(--accent)}
.lvbtn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lvbtn.locked{opacity:.45;cursor:not-allowed}
.lvbtn .cefr{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.goal{margin:9px 0 0;font-size:13px;color:var(--muted);max-width:70ch}

/* ---------- layout ---------- */
main{padding:20px;max-width:820px;margin:0 auto}
.view{display:none}
.view.active{display:block}

/* ---------- card ---------- */
.deckhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.pos{font-size:12px;color:var(--muted)}
.deckopts{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.deckopts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 24px;box-shadow:var(--shadow);min-height:220px}
.hanzi{font-size:52px;line-height:1.25;letter-spacing:.04em;margin:0}
.pinyin{font-size:19px;color:var(--accent2);margin:4px 0 0}
.tagrow{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.spk{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;
  padding:4px 10px;font-size:13px}
.spk:hover{border-color:var(--accent2)}
.tri{display:grid;gap:8px;margin:18px 0 0;border-top:1px solid var(--line);padding-top:16px}
.tri .row{display:flex;gap:11px;align-items:baseline}
.tri .flag{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--muted);min-width:26px}
.tri .val{font-size:19px}
.mnemo{margin-top:18px;background:linear-gradient(0deg,rgba(200,149,42,.09),rgba(200,149,42,.09)),var(--panel);
  border:1px solid rgba(200,149,42,.35);border-radius:12px;padding:13px 15px}
.mnemo h4{margin:0 0 5px;font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--gold)}
.mnemo p{margin:0;font-size:14px}
.example{margin-top:14px;border-left:3px solid var(--line);padding:2px 0 2px 13px}
.example .ez{font-size:18px}
.example .ep{font-size:13px;color:var(--accent2)}
.example .ee,.example .es{font-size:13px;color:var(--muted)}
.hidden{display:none}
.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:11px;padding:11px 18px;font-size:14px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.mid{border-color:var(--gold);color:var(--gold)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- generic panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h2{font-size:16px;margin-bottom:4px}
.panel h3{font-size:14px;margin:18px 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.empty .big{font-size:40px;display:block;margin-bottom:8px}

/* ---------- quiz ---------- */
.qprog{height:6px;background:var(--line);border-radius:20px;overflow:hidden;margin-bottom:18px}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qstem{font-size:14px;color:var(--muted);margin:0 0 6px}
.qbig{font-size:34px;margin:0 0 6px}
.qmid{font-size:22px;margin:0 0 6px}
.opts{display:grid;gap:9px;margin-top:18px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:11px;padding:13px 15px;font-size:16px}
.opt:hover{border-color:var(--accent2)}
.opt.right{border-color:var(--ok);background:rgba(31,122,77,.12);font-weight:600}
.opt.wrong{border-color:var(--bad);background:rgba(177,58,46,.12)}
.opt:disabled{cursor:default}
.feedback{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;font-size:14px}
.score{font-size:46px;font-weight:700;color:var(--accent)}
.scorewrap{text-align:center;padding:14px 0}
.pill{display:inline-block;font-size:12px;border-radius:20px;padding:3px 11px;border:1px solid var(--line)}
.pill.pass{border-color:var(--ok);color:var(--ok)}
.pill.fail{border-color:var(--bad);color:var(--bad)}

/* ---------- resources ---------- */
.res{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--bg)}
.res .rh{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.res .kind{font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  border-radius:5px;padding:2px 7px;border:1px solid var(--line);color:var(--muted)}
.res .kind.video{color:var(--accent);border-color:var(--accent)}
.res .kind.lectura{color:var(--accent2);border-color:var(--accent2)}
.res .kind.tema{color:var(--gold);border-color:var(--gold)}
.res .rt{font-weight:600;font-size:15px}
.res .lang{font-size:11px;color:var(--muted)}
.res p{margin:0;font-size:13.5px;color:var(--muted)}
.res a{font-size:13px;display:inline-block;margin-top:7px}

/* ---------- progress ---------- */
.bars{display:grid;gap:11px}
.barrow{display:grid;grid-template-columns:110px 1fr 74px;gap:11px;align-items:center;font-size:13px}
.bar{height:9px;background:var(--line);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--gold))}
.barnum{text-align:right;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.kpi b{display:block;font-size:25px;color:var(--accent)}
.kpi span{font-size:11px;color:var(--muted)}
table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist th,table.hist td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
table.hist th{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

footer{max-width:820px;margin:0 auto;padding:14px 20px 40px;display:flex;
  justify-content:space-between;font-size:11px;color:var(--muted);gap:10px;flex-wrap:wrap}

@media(max-width:560px){
  main{padding:14px}
  .hanzi{font-size:42px}
  .barrow{grid-template-columns:82px 1fr 60px}
  .top{padding:12px 14px}
}

</style>

    <span class="logo">三</span>
    <div>

  </div>
  <div class="topright">

      <span data-i18n="ui.baseLang"></span>

</div>

<main>
  <!-- APRENDER / LEARN / 学习 -->
  <section id="view-learn" class="view active">
    <div class="deckhead">
      <span id="deckPos" class="pos"></span>
      <div class="deckopts">
        <label><input type="checkbox" id="optPinyin" checked> <span data-i18n="learn.pinyin"></span></label>
        <label><input type="checkbox" id="optAudio" checked> <span data-i18n="learn.autoAudio"></span></label>
      </div>
    </div>
    <div id="card" class="card"></div>
    <div id="cardActions" class="actions"></div>
  </section>

  <!-- REPASAR / REVIEW / 复习 -->
  <section id="view-review" class="view"><div id="reviewBody"></div></section>

  <!-- QUIZ / 测验 -->
  <section id="view-quiz" class="view"><div id="quizBody"></div></section>

  <!-- RECURSOS / RESOURCES / 资源 -->
  <section id="view-res" class="view"><div id="resBody"></div></section>

  <!-- PROGRESO / PROGRESS / 进度 -->
  <section id="view-prog" class="view"><div id="progBody"></div></section>
</main>

<footer>
  <span data-i18n="foot.note"></span>
  <span id="savedAt"></span>
</footer>

      ex:{ zh:"我可以问一个问题吗？", py:"Wǒ kěyǐ wèn yí ge wèntí ma?", en:"May I ask a question?", es:"¿Puedo hacer una pregunta?" } },
    { id:"l3-06", zh:"应该", py:"yīnggāi", en:"should / ought to", es:"deber / debería", tag:"modales",

    { id:"l3-07", zh:"需要", py:"xūyào", en:"to need", es:"necesitar", tag:"modales",
      mn:"«xū-yào» ≈ «shü-yao» → «SÚ-YO lo necesito». Diferencia útil: 要 solo = «querer/pedir» (directo, casi exigente); 需要 = «necesitar» (neutral, profesional). En negocios usa siempre 需要.",

    { id:"l4-14", zh:"确认", py:"quèrèn", en:"to confirm", es:"confirmar", tag:"comunicación",
      mn:"确 = firme/sólido + 认 = reconocer → «reconocer en firme» = CONFIRMAR. «què-rèn» ≈ «chüe-ren». Frase de oro en correos: 请确认 = «please confirm» = «favor de confirmar».",
      ex:{ zh:"请确认收到这封邮件。", py:"Qǐng quèrèn shōudào zhè fēng yóujiàn.", en:"Please confirm receipt of this email.", es:"Por favor confirma la recepción de este correo." } },
    { id:"l4-15", zh:"截止日期", py:"jiézhǐ rìqī", en:"deadline / due date", es:"fecha límite", tag:"gestión",
      mn:"截 = cortar + 止 = detener + 日期 = fecha → «la fecha en que se corta y se detiene». El inglés «dead-line» usa la misma violencia (la línea de la muerte); el español lo suaviza a «fecha límite». La imagen del corte te sirve para los tres.",
      ex:{ zh:"截止日期是这个月底。", py:"Jiézhǐ rìqī shì zhège yuèdǐ.", en:"The deadline is the end of this month.", es:"La fecha límite es a fin de mes." } },
    { id:"l4-16", zh:"加班", py:"jiābān", en:"to work overtime", es:"hacer tiempo extra / quedarse tarde", tag:"trabajo",
      mn:"加 = añadir + 班 = turno → «añadir turno» = TIEMPO EXTRA. «jiā-bān» ≈ «yia-ban». Es una palabra culturalmente pesada en China (996): úsala con contexto, no como broma.",
      ex:{ zh:"这周我加了三天班。", py:"Zhè zhōu wǒ jiā le sān tiān bān.", en:"I worked overtime three days this week.", es:"Esta semana hice tiempo extra tres días." } },
    { id:"l4-17", zh:"出差", py:"chūchāi", en:"business trip", es:"viaje de negocios", tag:"trabajo",
      mn:"出 = salir + 差 = encargo/misión → «salir con encargo» = VIAJE DE TRABAJO. «chū-chāi» ≈ «chu-chai». Es VERBO: 我去出差 = «voy de viaje de trabajo», no «tengo un viaje».",
      ex:{ zh:"下周我要去上海出差。", py:"Xià zhōu wǒ yào qù Shànghǎi chūchāi.", en:"Next week I'm traveling to Shanghai on business.", es:"La próxima semana viajo a Shanghái por trabajo." } },
    { id:"l4-18", zh:"培训", py:"péixùn", en:"training", es:"capacitación / formación", tag:"trabajo",
      mn:"培 = cultivar (lleva 土 tierra: como a una planta) + 训 = instruir → «cultivar instruyendo». Misma metáfora que el español «formar» y el inglés «to grow talent». «péi-xùn» ≈ «pei-shün».",
      ex:{ zh:"公司下个月有销售培训。", py:"Gōngsī xià ge yuè yǒu xiāoshòu péixùn.", en:"The company has sales training next month.", es:"La empresa tiene capacitación de ventas el próximo mes." } },
    { id:"l4-19", zh:"效率", py:"xiàolǜ", en:"efficiency", es:"eficiencia", tag:"gestión",
      mn:"效 = efecto + 率 = tasa → «tasa de efecto» = EFICIENCIA. Ese 率 (lǜ = tasa/ratio) reaparece en 汇率 (tipo de cambio) y 利率 (tasa de interés): apréndelo como bloque, te da tres palabras.",
      ex:{ zh:"这个流程可以提高效率。", py:"Zhège liúchéng kěyǐ tígāo xiàolǜ.", en:"This process can improve efficiency.", es:"Este proceso puede mejorar la eficiencia." } },
    { id:"l4-20", zh:"目标", py:"mùbiāo", en:"goal / target", es:"objetivo / meta", tag:"gestión",
      mn:"目 = ojo + 标 = marca/señal → «la marca donde pones el ojo» = OBJETIVO. Exactamente la imagen del inglés «target» (la diana) y del español «poner la mira en». «mù-biāo» ≈ «mu-biao».",
      ex:{ zh:"今年的目标是增长百分之二十。", py:"Jīnnián de mùbiāo shì zēngzhǎng bǎi fēn zhī èrshí.", en:"This year's target is 20% growth.", es:"La meta de este año es crecer 20%." } }
  ]
},
{
  id: 5,

  items: [
    { id:"l5-01", zh:"市场", py:"shìchǎng", en:"market", es:"mercado", tag:"comercial",
      mn:"市 = ciudad/plaza + 场 = campo abierto → «la plaza abierta» = MERCADO. Cubre los dos sentidos igual que en español: el mercado físico y el mercado abstracto (market share = 市场份额).",
      ex:{ zh:"拉美市场增长很快。", py:"Lāměi shìchǎng zēngzhǎng hěn kuài.", en:"The Latin American market is growing fast.", es:"El mercado latinoamericano crece rápido." } },
    { id:"l5-02", zh:"销售", py:"xiāoshòu", en:"sales", es:"ventas", tag:"comercial",
      mn:"销 = despachar/fundir + 售 = vender. «xiāo-shòu» ≈ «shiao-shou». Truco: «SHOW y se vende». Ojo: 销售 = la FUNCIÓN de ventas (el área); 卖 = el acto de vender. En un CV siempre va 销售.",
      ex:{ zh:"销售团队有十个人。", py:"Xiāoshòu tuánduì yǒu shí ge rén.", en:"The sales team has ten people.", es:"El equipo de ventas tiene diez personas." } },
    { id:"l5-03", zh:"成本", py:"chéngběn", en:"cost", es:"costo", tag:"finanzas",
      mn:"成 = lograr/formar + 本 = raíz/capital (mira 本: es 木 «árbol» con una raya en la RAÍZ). «lo que cuesta formar desde la raíz» = COSTO. Ese 本 = «capital/raíz» aparece en 资本 (capital) y 成本 (costo).",
      ex:{ zh:"我们要控制成本。", py:"Wǒmen yào kòngzhì chéngběn.", en:"We need to control costs.", es:"Tenemos que controlar los costos." } },
    { id:"l5-04", zh:"利润", py:"lìrùn", en:"profit", es:"utilidad / ganancia", tag:"finanzas",
      mn:"利 = beneficio (grano 禾 + cuchillo 刂: cosechar el grano) + 润 = humedecer/enriquecer. «la cosecha que enriquece» = UTILIDAD. Ojo México: se dice «utilidad», no «profito»; en inglés «profit», nunca «utility» (falso amigo caro).",
      ex:{ zh:"今年的利润率是百分之十五。", py:"Jīnnián de lìrùnlǜ shì bǎi fēn zhī shíwǔ.", en:"This year's profit margin is 15%.", es:"El margen de utilidad de este año es 15%." } },
    { id:"l5-05", zh:"预算", py:"yùsuàn", en:"budget", es:"presupuesto", tag:"finanzas",
      mn:"预 = anticipado (mismo 预 de «pre-») + 算 = calcular → «cálculo anticipado». ¡Es literalmente PRE-SUPUESTO y PRE-computed! Los tres idiomas construyen la palabra igual: anticipar + calcular. «yù-suàn» ≈ «yu-suan» → «YO SUAN-o con el presupuesto».",
      ex:{ zh:"这个超出预算了。", py:"Zhège chāochū yùsuàn le.", en:"This is over budget.", es:"Esto se pasó del presupuesto." } },
    { id:"l5-06", zh:"投资", py:"tóuzī", en:"investment / to invest", es:"inversión / invertir", tag:"finanzas",
      mn:"投 = lanzar/arrojar + 资 = recursos → «arrojar recursos» = INVERTIR. La imagen es honesta: inviertes lanzando el dinero hacia adelante. «tóu-zī» ≈ «tou-tsi».",
      ex:{ zh:"我们打算投资新设备。", py:"Wǒmen dǎsuàn tóuzī xīn shèbèi.", en:"We plan to invest in new equipment.", es:"Planeamos invertir en equipo nuevo." } },
    { id:"l5-07", zh:"合同", py:"hétong", en:"contract", es:"contrato", tag:"legal",
      mn:"合 = unir/encajar + 同 = igual/mismo → «lo que ambos firman igual» = CONTRATO. «hé-tong» ≈ «je-tong». Truco: «HE-TON-go el contrato firmado». 签合同 = firmar contrato.",
      ex:{ zh:"合同下周签。", py:"Hétong xià zhōu qiān.", en:"The contract will be signed next week.", es:"El contrato se firma la próxima semana." } },
    { id:"l5-08", zh:"谈判", py:"tánpàn", en:"negotiation / to negotiate", es:"negociación / negociar", tag:"negociación",
      mn:"谈 = conversar + 判 = juzgar/decidir → «conversar hasta decidir» = NEGOCIAR. «tán-pàn» ≈ «tan-pan» → «TAN-to PAN se negocia». Nota: es más formal que el español «negociar»; para el regateo cotidiano se usa 讲价.",
      ex:{ zh:"谈判进行得很顺利。", py:"Tánpàn jìnxíng de hěn shùnlì.", en:"The negotiation is going smoothly.", es:"La negociación va muy bien." } },
    { id:"l5-09", zh:"报价", py:"bàojià", en:"quote / quotation", es:"cotización / cotizar", tag:"comercial",
      mn:"报 = informar (el mismo 报 de 报告 «reporte») + 价 = precio → «informar el precio» = COTIZAR. Si ya sabes 报告, esta te sale gratis: misma familia.",
      ex:{ zh:"请给我们发一份报价。", py:"Qǐng gěi wǒmen fā yí fèn bàojià.", en:"Please send us a quote.", es:"Por favor envíanos una cotización." } },
    { id:"l5-10", zh:"折扣", py:"zhékòu", en:"discount", es:"descuento", tag:"negociación",
      mn:"折 = doblar/partir + 扣 = descontar → «partir el precio». ¡TRAMPA CULTURAL! En China 八折 (8折) NO es 8% de descuento: es que pagas el 80% (o sea, 20% off). Se cuenta lo que PAGAS, no lo que te quitan. Este error cuesta dinero real.",
      ex:{ zh:"我们可以给你打九折。", py:"Wǒmen kěyǐ gěi nǐ dǎ jiǔ zhé.", en:"We can give you 10% off.", es:"Podemos darte 10% de descuento." } },
    { id:"l5-11", zh:"供应商", py:"gōngyìngshāng", en:"supplier / vendor", es:"proveedor", tag:"cadena",
      mn:"供应 = suministrar + 商 = comerciante → «el comerciante que suministra». Ese 商 = comercio/comerciante te da toda una familia: 商业 (negocio), 商务 (asuntos comerciales), 电商 (e-commerce).",
      ex:{ zh:"我们在找新的供应商。", py:"Wǒmen zài zhǎo xīn de gōngyìngshāng.", en:"We're looking for a new supplier.", es:"Estamos buscando un nuevo proveedor." } },
    { id:"l5-12", zh:"库存", py:"kùcún", en:"inventory / stock", es:"inventario / existencias", tag:"cadena",
      mn:"库 = almacén/bodega + 存 = guardar → «lo guardado en bodega» = INVENTARIO. «kù-cún» ≈ «ku-tsun». Cuidado: en inglés «stock» también es «acción bursátil» (股票 en chino). Dos conceptos, no los mezcles.",
      ex:{ zh:"库存不够了。", py:"Kùcún bú gòu le.", en:"We're running out of stock.", es:"Ya no alcanza el inventario." } },
    { id:"l5-13", zh:"交货", py:"jiāohuò", en:"delivery (of goods)", es:"entrega (de mercancía)", tag:"cadena",
      mn:"交 = entregar/intercambiar + 货 = mercancía. «jiāo-huò» ≈ «yiao-juo». Distingue: 交货 = entrega de mercancía (comercio); 送货 = envío a domicilio. El español «entrega» y el inglés «delivery» cubren ambas.",
      ex:{ zh:"交货时间是三十天。", py:"Jiāohuò shíjiān shì sānshí tiān.", en:"Delivery time is thirty days.", es:"El tiempo de entrega es de treinta días." } },
    { id:"l5-14", zh:"付款", py:"fùkuǎn", en:"payment / to pay", es:"pago / pagar", tag:"finanzas",
      mn:"付 = entregar (亻persona + 寸 mano) + 款 = suma de dinero → «entregar la suma». «fù-kuǎn» ≈ «fu-kuan». Familia: 付款 (pagar), 收款 (cobrar), 退款 (reembolsar). Los tres con 款.",
      ex:{ zh:"付款条件是三十天。", py:"Fùkuǎn tiáojiàn shì sānshí tiān.", en:"Payment terms are thirty days.", es:"Las condiciones de pago son a treinta días." } },
    { id:"l5-15", zh:"发票", py:"fāpiào", en:"invoice / official receipt", es:"factura", tag:"finanzas",
      mn:"发 = emitir + 票 = boleto/comprobante → «comprobante emitido» = FACTURA. Nota fiscal clave: el 发票 chino es un documento fiscal oficial controlado por el Estado, igual que el CFDI mexicano. NO es el «invoice» informal del inglés: si un proveedor chino te da un «receipt» sin 发票, no lo puedes deducir.",
      ex:{ zh:"请给我开发票。", py:"Qǐng gěi wǒ kāi fāpiào.", en:"Please issue me an invoice.", es:"Por favor emíteme la factura." } },
    { id:"l5-16", zh:"现金流", py:"xiànjīnliú", en:"cash flow", es:"flujo de efectivo", tag:"finanzas",
      mn:"现金 = dinero en efectivo (现 = presente/actual + 金 = oro) + 流 = fluir (lleva 氵 agua). ¡Los tres idiomas usan la MISMA metáfora del agua! cash FLOW = FLUJO de efectivo = 现金LIÚ. Una sola imagen, tres idiomas.",
      ex:{ zh:"现金流是最大的风险。", py:"Xiànjīnliú shì zuì dà de fēngxiǎn.", en:"Cash flow is the biggest risk.", es:"El flujo de efectivo es el mayor riesgo." } },
    { id:"l5-17", zh:"风险", py:"fēngxiǎn", en:"risk", es:"riesgo", tag:"gestión",
      mn:"风 = viento + 险 = peligro/precipicio → «viento y precipicio» = RIESGO. Imagen marinera: navegar con viento junto al acantilado. En español «riesgo» también viene del mar (roca/escollo). Misma raíz mental. «fēng-xiǎn» ≈ «fong-shien».",
      ex:{ zh:"这个方案风险太高。", py:"Zhège fāng'àn fēngxiǎn tài gāo.", en:"This option carries too much risk.", es:"Esta opción tiene demasiado riesgo." } },
    { id:"l5-18", zh:"增长", py:"zēngzhǎng", en:"growth / to grow", es:"crecimiento / crecer", tag:"finanzas",
      mn:"增 = aumentar (lleva 土 tierra: se añade tierra al montón) + 长 = largo/crecer. «zēng-zhǎng» ≈ «tseng-chang». Ojo: 长 tiene dos lecturas — cháng = largo, zhǎng = crecer. El tono cambia el significado: marca esta.",
      ex:{ zh:"我们的增长比去年快。", py:"Wǒmen de zēngzhǎng bǐ qùnián kuài.", en:"Our growth is faster than last year.", es:"Nuestro crecimiento es más rápido que el año pasado." } },
    { id:"l5-19", zh:"竞争", py:"jìngzhēng", en:"competition / to compete", es:"competencia / competir", tag:"comercial",
      mn:"竞 = disputar + 争 = pelear por algo → COMPETENCIA. «jìng-zhēng» ≈ «ching-cheng». Falso amigo español: «competencia» significa también «capacidad/aptitud» (=能力 nénglì en chino, «competence» en inglés). No los confundas al traducir un CV.",
      ex:{ zh:"这个行业竞争很激烈。", py:"Zhège hángyè jìngzhēng hěn jīliè.", en:"Competition in this industry is fierce.", es:"La competencia en esta industria es feroz." } },
    { id:"l5-20", zh:"战略", py:"zhànlüè", en:"strategy", es:"estrategia", tag:"gestión",
      mn:"战 = guerra + 略 = plan/esquema → «plan de guerra» = ESTRATEGIA. ¡Origen idéntico! «Estrategia» viene del griego «strategós» = general del ejército. Chino, español e inglés heredan la misma metáfora militar. Distingue: 战略 (estrategia, largo plazo) vs 战术 (táctica, corto plazo).",
      ex:{ zh:"这是长期战略，不是战术。", py:"Zhè shì chángqī zhànlüè, bú shì zhànshù.", en:"This is long-term strategy, not tactics.", es:"Esto es estrategia de largo plazo, no táctica." } }
  ]

{
  id: 6,
  code: "N6",
  name: { es: "Negocios avanzado", en: "Advanced business", zh: "高级商务" },
  cefr: "C1+",
  goal: {
    es: "Consejo, finanzas corporativas, legal, M&A y comercio internacional.",
    en: "Board, corporate finance, legal, M&A and international trade.",
    zh: "董事会、公司金融、法务、并购与国际贸易。"
  },
  items: [
    { id:"l6-01", zh:"股东", py:"gǔdōng", en:"shareholder", es:"accionista", tag:"corporativo",
      mn:"股 = porción/acción (originalmente «muslo», una PARTE del cuerpo) + 东 = este/anfitrión (el dueño de casa se sentaba al este) → «el dueño de una parte» = ACCIONISTA. Familia: 股票 (acción bursátil), 股份 (participación).",
      ex:{ zh:"股东会在六月举行。", py:"Gǔdōnghuì zài liù yuè jǔxíng.", en:"The shareholders' meeting is in June.", es:"La asamblea de accionistas es en junio." } },
    { id:"l6-02", zh:"董事会", py:"dǒngshìhuì", en:"board of directors", es:"consejo de administración", tag:"corporativo",
      mn:"董事 = director/consejero + 会 = asamblea. «dǒng-shì-huì» ≈ «dong-shi-juei». Truco: si ya sabes 会议 (junta), 会 = «reunión» ya está en tu cabeza: 董事+会 = la junta de los directores. Nota: en México se dice «consejo de administración», no «tablero» ni «board».",
      ex:{ zh:"董事会批准了这项投资。", py:"Dǒngshìhuì pīzhǔn le zhè xiàng tóuzī.", en:"The board approved this investment.", es:"El consejo aprobó esta inversión." } },
    { id:"l6-03", zh:"并购", py:"bìnggòu", en:"M&A (mergers & acquisitions)", es:"fusiones y adquisiciones", tag:"corporativo",
      mn:"并 = fusionar/juntar + 购 = adquirir/comprar. ¡Es literalmente M&A abreviado igual que en inglés! 并 = Merger, 购 = Acquisition. El chino comprime dos palabras en dos caracteres; el español necesita cuatro palabras.",
      ex:{ zh:"公司正在进行并购谈判。", py:"Gōngsī zhèngzài jìnxíng bìnggòu tánpàn.", en:"The company is in M&A negotiations.", es:"La empresa está en negociaciones de fusión y adquisición." } },
    { id:"l6-04", zh:"尽职调查", py:"jìnzhí diàochá", en:"due diligence", es:"debida diligencia / auditoría de compra", tag:"legal",
      mn:"尽职 = cumplir con el deber («due diligence» literal) + 调查 = investigar. Los tres idiomas dicen lo mismo: «investigar cumpliendo tu deber». Se abrevia DD en los tres. «jìn-zhí diào-chá» ≈ «yin-chi diao-cha».",
      ex:{ zh:"尽职调查需要六个星期。", py:"Jìnzhí diàochá xūyào liù ge xīngqī.", en:"Due diligence will take six weeks.", es:"La debida diligencia tomará seis semanas." } },
    { id:"l6-05", zh:"估值", py:"gūzhí", en:"valuation", es:"valuación / valoración", tag:"finanzas",
      mn:"估 = estimar + 值 = valor → «estimar el valor» = VALUACIÓN. «gū-zhí» ≈ «gu-chi». Nota de uso: en México se dice «valuación»; en España «valoración». En inglés cuidado: «valuation» (cuánto vale) ≠ «evaluation» (qué tan bueno es) = 评估.",
      ex:{ zh:"他们的估值太高了。", py:"Tāmen de gūzhí tài gāo le.", en:"Their valuation is too high.", es:"Su valuación está demasiado alta." } },
    { id:"l6-06", zh:"资产负债表", py:"zīchǎn fùzhài biǎo", en:"balance sheet", es:"balance general / estado de situación financiera", tag:"finanzas",
      mn:"资产 (activos) + 负债 (pasivos) + 表 (tabla) = «tabla de activos y pasivos». ¡El chino es MÁS claro que los otros dos! El inglés dice «balance sheet» y el español «balance general» sin decir de qué; el chino te dice exactamente qué contiene. Bonus: reconoces 负 de 负责 (cargar) → 负债 = «cargar deuda».",
      ex:{ zh:"请看资产负债表的第二页。", py:"Qǐng kàn zīchǎn fùzhài biǎo de dì-èr yè.", en:"Please look at page two of the balance sheet.", es:"Por favor vean la página dos del balance general." } },
    { id:"l6-07", zh:"损益表", py:"sǔnyì biǎo", en:"income statement / P&L", es:"estado de resultados", tag:"finanzas",
      mn:"损 (pérdida) + 益 (beneficio) + 表 (tabla) = «tabla de pérdidas y ganancias». Es EXACTAMENTE el inglés «P&L» (Profit & Loss). El español «estado de resultados» es el que se aleja: memorízalo por el par ZH-EN.",
      ex:{ zh:"损益表显示我们盈利了。", py:"Sǔnyì biǎo xiǎnshì wǒmen yínglì le.", en:"The P&L shows we were profitable.", es:"El estado de resultados muestra que fuimos rentables." } },
    { id:"l6-08", zh:"合规", py:"héguī", en:"compliance", es:"cumplimiento normativo", tag:"legal",
      mn:"合 = ajustarse a (el mismo 合 de 合同 «contrato») + 规 = norma/regla → «ajustarse a la norma» = CUMPLIMIENTO. Dos caracteres contra dos palabras en español. «hé-guī» ≈ «je-guei».",
      ex:{ zh:"合规部门必须先审核。", py:"Héguī bùmén bìxū xiān shěnhé.", en:"Compliance must review it first.", es:"Cumplimiento debe revisarlo primero." } },
    { id:"l6-09", zh:"知识产权", py:"zhīshi chǎnquán", en:"intellectual property (IP)", es:"propiedad intelectual", tag:"legal",
      mn:"知识 (conocimiento) + 产权 (derechos de propiedad) = «derechos de propiedad del conocimiento». Traducción calcada palabra por palabra en los tres idiomas. Si separas 产 (producir/bien) + 权 (derecho), reconoces 权 en 授权 (autorizar) y 股权 (derechos accionarios).",

        en:"Listen to real executives. Level goal: follow a five-minute interview without subtitles and summarise it in the other two languages.",
        zh:"听真实高管讲话。本级目标：无字幕听懂五分钟访谈，并用另外两种语言复述。"} },
    { type:"tema", title:"Traducción de cláusulas contractuales", lang:"ALL", url:"https://www.hkexnews.hk/",
      why:{
        es:"Toma un contrato tipo (NDA) y tradúcelo ZH→ES→EN→ZH. Cuando el texto vuelve al punto de partida y sigue significando lo mismo, dominas el nivel. Ojo con 违约金 (pena convencional ≠ «penalty» en todo contexto).",
        en:"Take a standard NDA and translate it ZH→ES→EN→ZH. When the text comes back around still meaning the same thing, you've mastered the level. Watch 违约金 — «pena convencional» is not «penalty» in every context.",
        zh:"拿一份标准保密协议做 中→西→英→中 的循环翻译。绕一圈回来意思不变，本级即算过关。注意 违约金 在不同法域并不总等于 penalty。"} },
    { type:"tema", title:"Presentar ante un consejo", lang:"ALL",
      url:"https://www.youtube.com/results?search_query=executive+presentation+board+SCQA+structure",
      why:{
        es:"Estructura universal: situación → complicación → pregunta → respuesta (SCQA). Practica el mismo pitch de 3 minutos en los tres idiomas. Lo que no puedes decir en 3 minutos, no lo entiendes.",
        en:"Universal structure: situation → complication → question → answer (SCQA). Practise the same three-minute pitch in all three languages. What you can't say in three minutes, you don't understand.",
        zh:"通用结构：情境 → 冲突 → 问题 → 答案（SCQA）。同一段三分钟陈述用三种语言各讲一遍。三分钟讲不清，说明还没想清。"} }
  ]
};

</script>
<script>
/* ============================================================
   ZH-EN-SP · Tutor trilingüe con mnemotecnia
   - Interfaz completa en español / inglés / 中文 (selector "idioma base")
   - Repaso espaciado (cajas de Leitner)
   - Quizzes que se adaptan al idioma base, con desbloqueo de nivel (80%)
   - Progreso persistente en localStorage
   ============================================================ */
(function () {
"use strict";

/* ---------- datos ---------- */
var LEVELS = (window.LEVELS_A || []).concat(window.LEVELS_B || []);
var RES = window.RESOURCES || {};
var I = window.I18N;
var ALL = [];
LEVELS.forEach(function (lv) { lv.items.forEach(function (it) { it.level = lv.id; ALL.push(it); }); });

/* ---------- constantes ---------- */
var KEY = "zhensp.progress.v1";
var INTERVALS = [0, 1, 2, 4, 8, 16, 35];   // días por caja de Leitner
var MAX_BOX = INTERVALS.length - 1;
var PASS = 0.8;                             // 80% para desbloquear el siguiente nivel
var QUIZ_LEN = 10;
var LOCALE = { es: "es-MX", en: "en-US", zh: "zh-CN" };
var SPEECH = { zh: "zh-CN", en: "en-US", es: "es-MX" };

/* Direcciones de pregunta según el idioma base (el idioma que ya dominas) */
var DIRS = {
  es: [["zh","es"],["es","zh"],["en","es"],["zh","py"],["zh","en"]],
  en: [["zh","en"],["en","zh"],["es","en"],["zh","py"],["zh","es"]],
  zh: [["zh","es"],["es","zh"],["en","es"],["zh","py"],["es","en"]]
};

/* ---------- i18n ---------- */
function t(key, vars) {
  var dict = I.ui[S && S.base ? S.base : "es"] || I.ui.es;
  var s = dict[key] != null ? dict[key] : (I.ui.es[key] != null ? I.ui.es[key] : key);
  if (vars) s = s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; });
  return s;
}
function langName(code) { return (I.lang[S.base] || I.lang.es)[code] || code; }
function tagName(tag) {
  if (S.base === "es") return tag;
  var map = I.tags[S.base] || {};
  return map[tag] || tag;
}
function resType(type) {
  if (S.base === "es") return type;
  return (I.restype[S.base] || {})[type] || type;
}
function lvName(lv) { return lv.name[S.base] || lv.name.es; }
function lvGoal(lv) { return lv.goal[S.base] || lv.goal.es; }
function resWhy(r) { return (r.why && (r.why[S.base] || r.why.es)) || ""; }

/* ---------- utilidades ---------- */
function $(s) { return document.querySelector(s); }
function all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function ymd(d) {                    // fecha LOCAL (no UTC): el día no debe cambiar a media tarde
  var m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
}
function today() { return ymd(new Date()); }
function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}
function pick(a, n) { return shuffle(a).slice(0, n); }
function level(id) { for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].id === id) return LEVELS[i]; return LEVELS[0]; }

/* ---------- estado ---------- */
var S;
function fresh() {
  return { v: 1, base: "es", level: 1, unlocked: 1, xp: 0,
           streak: { count: 0, last: null }, cards: {}, quizzes: [] };
}
function load() {
  try { var raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : fresh(); }
  catch (e) { S = fresh(); }
  var f = fresh();
  for (var k in f) if (!(k in S)) S[k] = f[k];
  if (!I.ui[S.base]) S.base = "es";
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    $("#savedAt").textContent = t("foot.saved", {
      t: new Date().toLocaleTimeString(LOCALE[S.base] || "es-MX", { hour: "2-digit", minute: "2-digit" })
    });
  } catch (e) { $("#savedAt").textContent = t("foot.saveFail"); }
}
function markStudiedToday() {
  var td = today();
  if (S.streak.last !== td) {
    S.streak.count = (S.streak.last === addDays(-1) || S.streak.last === null) ? (S.streak.count || 0) + 1 : 1;
    S.streak.last = td;
  }
}
function card(id) {                 // escritura: crea la ficha si no existe
  if (!S.cards[id]) S.cards[id] = { box: 0, due: today(), seen: 0, ok: 0, bad: 0 };
  return S.cards[id];
}
function peek(id) {                 // lectura: NO crea nada (ver una tarjeta no la agenda)
  return S.cards[id] || { box: 0, due: null, seen: 0, ok: 0, bad: 0 };
}
function grade(id, g) {             // g: 0 = no la sé · 1 = casi · 2 = la sé
  var c = card(id);
  c.seen++;
  if (g === 2) { c.box = Math.min(MAX_BOX, c.box + 1); c.ok++; S.xp += 10; }
  else if (g === 1) { c.box = Math.max(1, c.box); S.xp += 5; }
  else { c.box = 0; c.bad++; S.xp += 2; }
  c.due = addDays(INTERVALS[c.box]);
  markStudiedToday();
  save(); paintHeader();
}
function dueList() {
  var td = today();
  return ALL.filter(function (it) {
    if (it.level > S.unlocked) return false;
    var c = S.cards[it.id];
    return c && c.due <= td;
  });
}
function mastery(lvId) {
  var items = level(lvId).items, sum = 0;
  items.forEach(function (it) { sum += peek(it.id).box / MAX_BOX; });
  return items.length ? sum / items.length : 0;
}

/* ---------- audio ---------- */
function speak(text, lang) {
  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = SPEECH[lang] || "zh-CN";
    u.rate = lang === "zh" ? 0.85 : 0.95;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function wireSpeak(root) {
  all(".spk", root).forEach(function (b) {
    b.onclick = function (e) { e.stopPropagation(); speak(b.dataset.say, b.dataset.lang); };
  });
}
function spkBtn(text, lang, label) {
  return "<button class='spk' data-say='" + esc(text) + "' data-lang='" + lang + "'>🔊" +
         (label ? " " + esc(label) : "") + "</button>";
}
function mnemoBox(text, marginTop) {
  return "<div class='mnemo'" + (marginTop ? " style='margin-top:12px'" : "") + "><h4>" +
         t("ui.mnemo") + "</h4><p>" + esc(text) + "</p></div>";
}

/* ---------- cromo estático (etiquetas fijas de la página) ---------- */
function applyChrome() {
  document.documentElement.lang = S.base;
  all("[data-i18n]").forEach(function (el) { el.textContent = t(el.dataset.i18n); });
  $("#baseLang").value = S.base;
}
function paintHeader() {
  $("#xpVal").textContent = S.xp;
  $("#streakVal").textContent = S.streak.count || 0;
  var d = dueList().length;
  $("#dueBadge").textContent = d ? d : "";
}
function paintLevels() {
  var box = $("#levelPicker"); box.innerHTML = "";
  LEVELS.forEach(function (lv) {
    var locked = lv.id > S.unlocked;
    var b = document.createElement("button");
    b.className = "lvbtn" + (lv.id === S.level ? " on" : "") + (locked ? " locked" : "");
    b.innerHTML = "<b>" + lv.code + "</b> " + esc(lvName(lv)) +
                  " <span class='cefr'>" + lv.cefr + "</span>" +
                  (locked ? " 🔒" : " <span class='cefr'>" + Math.round(mastery(lv.id) * 100) + "%</span>");
    if (locked) { b.title = t("ui.lockedHint"); b.disabled = true; }
    else b.onclick = function () { S.level = lv.id; deckPos = 0; revealed = false; quiz = null; save(); paintLevels(); render(); };
    box.appendChild(b);
  });
  $("#levelGoal").textContent = "🎯 " + lvGoal(level(S.level));
}

/* ---------- vista: APRENDER ---------- */
var deckPos = 0, revealed = false;
function deck() { return level(S.level).items; }

function renderLearn() {
  var items = deck();
  if (deckPos >= items.length) deckPos = 0;
  var it = items[deckPos];
  var showPinyin = $("#optPinyin").checked;
  var frontLang = S.base === "zh" ? "es" : "zh";   // si tu base es el chino, la cara visible es el español

  $("#deckPos").textContent = t("learn.pos", { i: deckPos + 1, n: items.length, b: peek(it.id).box, m: MAX_BOX });

  var h = "<div class='tagrow'><span class='tag'>" + esc(tagName(it.tag)) + "</span>" +
          spkBtn(it.zh, "zh", "中文") + spkBtn(it.en, "en", "EN") + spkBtn(it.es, "es", "ES") + "</div>";
  h += "<p class='hanzi'>" + esc(it[frontLang]) + "</p>";
  if (frontLang === "zh" && showPinyin) h += "<p class='pinyin'>" + esc(it.py) + "</p>";

  if (!revealed) {
    h += "<p class='sub' style='margin-top:22px'>" + t("learn.front") + "</p>";
  } else {
    h += "<div class='tri'>";
    h += "<div class='row'><span class='flag'>中文</span><span class='val'>" + esc(it.zh) +
         " <em style='font-style:normal;color:var(--accent2);font-size:15px'>" + esc(it.py) + "</em></span></div>";
    h += "<div class='row'><span class='flag'>EN</span><span class='val'>" + esc(it.en) + "</span></div>";
    h += "<div class='row'><span class='flag'>ES</span><span class='val'>" + esc(it.es) + "</span></div>";
    h += "</div>";
    h += mnemoBox(it.mn);
    h += "<div class='example'>";
    h += "<div class='ez'>" + esc(it.ex.zh) + " " + spkBtn(it.ex.zh, "zh") + "</div>";
    h += "<div class='ep'>" + esc(it.ex.py) + "</div>";
    h += "<div class='ee'>EN · " + esc(it.ex.en) + "</div>";
    h += "<div class='es'>ES · " + esc(it.ex.es) + "</div>";
    h += "</div>";
  }
  $("#card").innerHTML = h;

  $("#cardActions").innerHTML = revealed
    ? "<button class='btn bad' data-g='0'>" + t("learn.g0") + "</button>" +
      "<button class='btn mid' data-g='1'>" + t("learn.g1") + "</button>" +
      "<button class='btn ok'  data-g='2'>" + t("learn.g2") + "</button>"
    : "<button class='btn primary' id='bReveal'>" + t("learn.show") + "</button>" +
      "<button class='btn ghost' id='bSkip'>" + t("learn.skip") + "</button>";

  if ($("#optAudio").checked) speak(it[frontLang], frontLang);

  wireSpeak();
  if ($("#bReveal")) $("#bReveal").onclick = function () { revealed = true; renderLearn(); };
  if ($("#bSkip")) $("#bSkip").onclick = function () { deckPos++; revealed = false; renderLearn(); };
  all("#cardActions [data-g]").forEach(function (b) {
    b.onclick = function () { grade(it.id, +b.dataset.g); deckPos++; revealed = false; renderLearn(); paintLevels(); };
  });
}

/* ---------- vista: REPASAR ---------- */
var revQueue = null, revRevealed = false;
function renderReview() {
  var body = $("#reviewBody");
  if (revQueue === null) revQueue = shuffle(dueList());
  revQueue = revQueue.filter(function (it) { var c = S.cards[it.id]; return c && c.due <= today(); });

  if (!revQueue.length) {
    var seen = Object.keys(S.cards).length;
    body.innerHTML = "<div class='panel'><div class='empty'><span class='big'>✅</span>" +
      (seen ? "<b>" + t("rev.doneTitle") + "</b><p class='sub' style='margin-top:8px'>" + t("rev.doneBody", { n: seen }) + "</p>"
            : "<b>" + t("rev.newTitle") + "</b><p class='sub' style='margin-top:8px'>" + t("rev.newBody") + "</p>") +
      "</div></div>";
    return;
  }
  var it = revQueue[0];
  var h = "<div class='panel'><p class='sub'>" + t("rev.pending", { n: revQueue.length, l: it.level }) + "</p>";
  h += "<p class='hanzi'>" + esc(it.zh) + "</p>";
  if (revRevealed) {
    h += "<p class='pinyin'>" + esc(it.py) + "</p>";
    h += "<div class='tri'><div class='row'><span class='flag'>EN</span><span class='val'>" + esc(it.en) + "</span></div>" +
         "<div class='row'><span class='flag'>ES</span><span class='val'>" + esc(it.es) + "</span></div></div>";
    h += mnemoBox(it.mn);
    h += "<div class='actions'><button class='btn bad' data-rg='0'>" + t("learn.g0") + "</button>" +
         "<button class='btn mid' data-rg='1'>" + t("learn.g1") + "</button>" +
         "<button class='btn ok' data-rg='2'>" + t("learn.g2") + "</button></div>";
  } else {
    h += "<div class='actions'><button class='btn primary' id='rReveal'>" + t("rev.show") + "</button>" +
         "<button class='btn ghost spk' data-say='" + esc(it.zh) + "' data-lang='zh'>" + t("rev.listen") + "</button></div>";
  }
  body.innerHTML = h + "</div>";

  wireSpeak(body);
  if ($("#rReveal")) $("#rReveal").onclick = function () { revRevealed = true; renderReview(); };
  all("[data-rg]", body).forEach(function (b) {
    b.onclick = function () { grade(it.id, +b.dataset.rg); revQueue.shift(); revRevealed = false; renderReview(); paintLevels(); };
  });
}

/* ---------- vista: QUIZ ---------- */
var quiz = null;
function buildQuiz(lvId) {
  var pool = level(lvId).items;
  var chosen = pick(pool, Math.min(QUIZ_LEN, pool.length));
  var dirs = DIRS[S.base] || DIRS.es;
  var distract = ALL.filter(function (x) { return x.level <= Math.max(lvId, S.unlocked); });
  if (distract.length < 6) distract = ALL;

  var qs = chosen.map(function (it, i) {
    var d = dirs[i % dirs.length], from = d[0], to = d[1];
    var wrong = shuffle(distract.filter(function (x) { return x.id !== it.id && x[to] !== it[to]; })).slice(0, 3);
    return {
      id: it.id, item: it, from: from, to: to,
      stem: to === "py" ? t("quiz.pinyinQ") : t("quiz.translate") + ": " + langName(from) + " → " + langName(to),
      big: it[from],
      small: (from === "zh" && to !== "py") ? it.py : "",
      answer: it[to],
      opts: shuffle([it[to]].concat(wrong.map(function (w) { return w[to]; })))
    };
  });
  return { lv: lvId, qs: shuffle(qs), i: 0, right: 0, answered: false, wrongList: [] };
}

function renderQuiz() {
  var body = $("#quizBody");
  var lv = level(S.level);

  if (!quiz) {
    var last = S.quizzes.filter(function (q) { return q.level === S.level; }).slice(-1)[0];
    body.innerHTML =
      "<div class='panel'><h2>" + t("quiz.title", { code: lv.code, name: esc(lvName(lv)) }) + "</h2>" +
      "<p class='sub'>" + t("quiz.intro", { n: QUIZ_LEN, p: PASS * 100 }) + "</p>" +
      (last ? "<p class='sub'>" + t("quiz.last", { p: last.pct, d: last.date }) + "</p>" : "") +
      "<button class='btn primary' id='qStart'>" + t("quiz.start") + "</button></div>";
    $("#qStart").onclick = function () { quiz = buildQuiz(S.level); renderQuiz(); };
    return;
  }

  if (quiz.i >= quiz.qs.length) {
    var pct = Math.round(quiz.right / quiz.qs.length * 100);
    var passed = pct >= PASS * 100;
    S.quizzes.push({ level: quiz.lv, score: quiz.right, total: quiz.qs.length, pct: pct, date: today() });
    S.xp += quiz.right * 15;
    if (passed && quiz.lv === S.unlocked && S.unlocked < LEVELS.length) S.unlocked = quiz.lv + 1;
    markStudiedToday(); save(); paintHeader(); paintLevels();

    var h = "<div class='panel'><div class='scorewrap'><div class='score'>" + pct + "%</div>" +
      "<p class='sub'>" + t("quiz.results", { r: quiz.right, n: quiz.qs.length }) + "</p>" +
      "<span class='pill " + (passed ? "pass'>" + t("quiz.pass") : "fail'>" + t("quiz.fail")) + "</span></div>";
    if (passed && quiz.lv < LEVELS.length) {
      var nx = level(quiz.lv + 1);
      h += "<p class='sub' style='text-align:center'>" + t("quiz.unlocked", { code: nx.code, name: esc(lvName(nx)) }) + "</p>";
    }
    if (quiz.wrongList.length) {
      h += "<h3>" + t("quiz.toReview") + "</h3>";
      quiz.wrongList.forEach(function (it) {
        h += "<div class='res'><div class='rh'><span class='rt'>" + esc(it.zh) + " · " + esc(it.py) + "</span>" +
             "<span class='lang'>" + esc(it.es) + " / " + esc(it.en) + "</span></div><p>" + esc(it.mn) + "</p></div>";
      });
    }
    h += "<div class='actions'><button class='btn primary' id='qAgain'>" + t("quiz.again") + "</button>" +
         "<button class='btn ghost' id='qClose'>" + t("quiz.close") + "</button></div></div>";
    body.innerHTML = h;
    $("#qAgain").onclick = function () { quiz = buildQuiz(S.level); renderQuiz(); };
    $("#qClose").onclick = function () { quiz = null; renderQuiz(); };
    return;
  }

  var q = quiz.qs[quiz.i];
  var bar = quiz.i / quiz.qs.length * 100;
  var big = "<div class='panel'><div class='qprog'><i style='width:" + bar + "%'></i></div>";
  big += "<p class='qstem'>" + t("quiz.qnum", { i: quiz.i + 1, n: quiz.qs.length }) + " · " + q.stem + "</p>";
  big += "<p class='" + (q.from === "zh" ? "qbig" : "qmid") + "'>" + esc(q.big) + " " + spkBtn(q.big, q.from) + "</p>";
  if (q.small) big += "<p class='pinyin'>" + esc(q.small) + "</p>";
  big += "<div class='opts'>";
  q.opts.forEach(function (o) { big += "<button class='opt' data-o=\"" + esc(o) + "\">" + esc(o) + "</button>"; });
  big += "</div><div id='qFeed'></div></div>";
  body.innerHTML = big;

  wireSpeak(body);
  all(".opt", body).forEach(function (b) {
    b.onclick = function () {
      if (quiz.answered) return;
      quiz.answered = true;
      var good = b.dataset.o === q.answer;
      all(".opt", body).forEach(function (x) {
        x.disabled = true;
        if (x.dataset.o === q.answer) x.classList.add("right");
        else if (x === b) x.classList.add("wrong");
      });
      var c = card(q.id); c.seen++;
      if (good) { quiz.right++; c.ok++; c.box = Math.min(MAX_BOX, c.box + 1); }
      else { c.bad++; c.box = 0; quiz.wrongList.push(q.item); }
      c.due = addDays(INTERVALS[c.box]);
      save();
      $("#qFeed").innerHTML = "<div class='feedback'>" +
        (good ? t("quiz.correct") : t("quiz.wrong") + esc(q.answer)) + mnemoBox(q.item.mn, true) +
        "<div class='actions'><button class='btn primary' id='qNext'>" + t("quiz.next") + "</button></div></div>";
      $("#qNext").onclick = function () { quiz.i++; quiz.answered = false; renderQuiz(); };
    };
  });
}

/* ---------- vista: RECURSOS ---------- */
function renderRes() {
  var lv = level(S.level);
  var list = RES[S.level] || [];
  var h = "<div class='panel'><h2>" + t("res.title", { code: lv.code, name: esc(lvName(lv)) }) + "</h2>" +
          "<p class='sub'>" + t("res.sub") + "</p>";
  list.forEach(function (r) {
    h += "<div class='res'><div class='rh'><span class='kind " + esc(r.type) + "'>" + esc(resType(r.type)) + "</span>" +
         "<span class='rt'>" + esc(r.title) + "</span><span class='lang'>" + esc(r.lang) + "</span></div>" +
         "<p>" + esc(resWhy(r)) + "</p>" +
         "<a href='" + esc(r.url) + "' target='_blank' rel='noopener noreferrer'>" + t("res.open") + "</a></div>";
  });
  h += "</div><div class='panel'><h2>" + t("res.howTitle") + "</h2><p class='sub'>" + t("res.howSub") + "</p>" +
       "<ol style='margin:0;padding-left:20px;font-size:14px;line-height:1.9'>" +
       "<li>" + t("res.step1") + "</li><li>" + t("res.step2") + "</li>" +
       "<li>" + t("res.step3") + "</li><li>" + t("res.step4") + "</li></ol></div>";
  $("#resBody").innerHTML = h;
}

/* ---------- vista: PROGRESO ---------- */
function renderProg() {
  var seen = Object.keys(S.cards).length;
  var learned = Object.keys(S.cards).filter(function (k) { return S.cards[k].box >= 4; }).length;

  var h = "<div class='panel'><h2>" + t("prog.title") + "</h2><div class='kpis'>" +
    "<div class='kpi'><b>" + seen + "</b><span>" + t("prog.seen") + "</span></div>" +
    "<div class='kpi'><b>" + learned + "</b><span>" + t("prog.mastered") + "</span></div>" +
    "<div class='kpi'><b>" + ALL.length + "</b><span>" + t("prog.total") + "</span></div>" +
    "<div class='kpi'><b>" + dueList().length + "</b><span>" + t("prog.due") + "</span></div>" +
    "<div class='kpi'><b>" + S.xp + "</b><span>" + t("prog.xp") + "</span></div>" +
    "<div class='kpi'><b>" + (S.streak.count || 0) + "</b><span>" + t("prog.streak") + "</span></div></div>";

  h += "<h3>" + t("prog.byLevel") + "</h3><div class='bars'>";
  LEVELS.forEach(function (lv) {
    var m = Math.round(mastery(lv.id) * 100);
    h += "<div class='barrow'><span>" + lv.code + " " + esc(lvName(lv)) + "</span>" +
         "<span class='bar'><i style='width:" + m + "%'></i></span>" +
         "<span class='barnum'>" + (lv.id > S.unlocked ? "🔒" : m + "%") + "</span></div>";
  });
  h += "</div></div>";

  if (S.quizzes.length) {
    h += "<div class='panel'><h2>" + t("prog.history") + "</h2><table class='hist'><tr><th>" +
         t("prog.thDate") + "</th><th>" + t("prog.thLevel") + "</th><th>" + t("prog.thResult") + "</th><th></th></tr>";
    S.quizzes.slice().reverse().slice(0, 15).forEach(function (q) {
      h += "<tr><td>" + q.date + "</td><td>" + level(q.level).code + "</td><td>" + q.score + "/" + q.total + "</td>" +
           "<td><span class='pill " + (q.pct >= PASS * 100 ? "pass'>" : "fail'>") + q.pct + "%</span></td></tr>";
    });
    h += "</table></div>";
  }

  h += "<div class='panel'><h2>" + t("prog.backup") + "</h2><p class='sub'>" + t("prog.backupSub") + "</p>" +
    "<div class='actions'><button class='btn' id='pExport'>" + t("prog.export") + "</button>" +
    "<button class='btn' id='pImport'>" + t("prog.import") + "</button>" +
    "<button class='btn bad ghost' id='pReset'>" + t("prog.reset") + "</button></div>" +
    "<input type='file' id='pFile' accept='.json' style='display:none'></div>";

  $("#progBody").innerHTML = h;

  $("#pExport").onclick = function () {
    var json = JSON.stringify(S, null, 2);
    var name = "zh-en-sp-" + today() + ".json";

    // Publicada en claude.ai el visor media las descargas; en local (file:// o
    // cualquier hosting estático) no existe window.claude y se usa un enlace normal.
    function fallback() {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      a.download = name;
      a.click();
    }
    if (!(window.claude && typeof window.claude.use === "function")) return fallback();

    window.claude.use("downloads").then(function (dl) {
      if (!dl) return fallback();
      return dl.save({ filename: name, data: json })["catch"](function (err) {
        if (!err || err.code !== "declined") alert(t("prog.exportFail"));
      });
    })["catch"](fallback);
  };
  $("#pImport").onclick = function () { $("#pFile").click(); };
  $("#pFile").onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || typeof d !== "object" || !("cards" in d)) throw 0;
        S = d; var fr = fresh(); for (var k in fr) if (!(k in S)) S[k] = fr[k];
        if (!I.ui[S.base]) S.base = "es";
        save(); boot(); alert(t("prog.imported"));
      } catch (err) { alert(t("prog.badFile")); }
    };
    r.readAsText(f);
  };
  $("#pReset").onclick = function () {
    if (confirm(t("prog.confirmReset"))) { var b = S.base; S = fresh(); S.base = b; save(); boot(); }
  };
}

/* ---------- router ---------- */
var view = "learn";
function render() {
  if (view === "learn") renderLearn();
  else if (view === "review") renderReview();
  else if (view === "quiz") renderQuiz();
  else if (view === "res") renderRes();
  else renderProg();
  paintHeader();
}
function renderAll() {               // redibuja las 5 vistas, no solo la activa
  renderLearn(); renderReview(); renderQuiz(); renderRes(); renderProg(); paintHeader();
}
function boot() { applyChrome(); paintLevels(); renderAll(); }

document.addEventListener("DOMContentLoaded", function () {
  load();

  all(".tab").forEach(function (tb) {
    tb.onclick = function () {
      all(".tab").forEach(function (x) { x.classList.remove("active"); });
      all(".view").forEach(function (x) { x.classList.remove("active"); });
      tb.classList.add("active");
      view = tb.dataset.view;
      $("#view-" + view).classList.add("active");
      if (view === "review") { revQueue = null; revRevealed = false; }
      if (view === "quiz") quiz = null;
      render();
    };
  });

  /* cambiar el idioma base recarga TODA la interfaz, no solo las tarjetas */
  $("#baseLang").onchange = function () {
    S.base = this.value;
    revealed = false; revQueue = null; revRevealed = false; quiz = null;
    save(); boot();                 // boot() -> applyChrome + renderAll: toda la app cambia de idioma
  };
  $("#optPinyin").onchange = renderLearn;

  document.addEventListener("keydown", function (e) {
    if (view !== "learn") return;
    if (e.code === "Space") { e.preventDefault(); if (!revealed) { revealed = true; renderLearn(); } }
    if (revealed && ["1", "2", "3"].indexOf(e.key) >= 0) {
      grade(deck()[deckPos].id, +e.key - 1);
      deckPos++; revealed = false; renderLearn(); paintLevels();
    }
  });

  boot();
  save();
});

})();

</script>
